<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ドリルをえらぼう</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
            color: #31495a;
            background: #eef9ff;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(150deg, #88ddff 0%, #ddf6ff 52%, #fff4cf 100%);
        }

        .screen {
            width: min(760px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(28px, 6vw, 64px) clamp(16px, 4vw, 32px);
        }

        h1 {
            margin: 0 0 28px;
            color: #ff704e;
            font-size: clamp(34px, 7vw, 56px);
            line-height: 1.15;
            text-align: center;
            letter-spacing: .04em;
            text-shadow: 0 4px 0 #ffe2a2;
        }

        .status {
            padding: 28px 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            background: rgba(255, 255, 255, .9);
            border-radius: 20px;
        }

        .status.error { color: #b84738; }

        .list {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .category-group {
            position: relative;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .category-group + .category-group::before {
            position: absolute;
            top: -20px;
            right: 8px;
            left: 8px;
            height: 1px;
            content: "";
            background: #fff;
        }

        .start-button {
            min-height: 78px;
            padding: 16px 18px;
            color: #fff;
            font: inherit;
            font-size: clamp(18px, 3vw, 22px);
            font-weight: 900;
            cursor: pointer;
            background: #ff7956;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 6px 0 #dc5337;
            transition: transform .12s ease, box-shadow .12s ease;
        }

        .start-button:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #dc5337;
        }

        .start-button:not(:disabled):active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #dc5337;
        }

        .start-button:focus-visible { outline: 4px solid #24799b; outline-offset: 3px; }
        .start-button:disabled { cursor: wait; opacity: .65; }

        @media (max-width: 560px) {
            .category-group { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            .start-button { transition: none; }
        }
    </style>
</head>
<body>
    <main class="screen">
        <h1>ドリルを えらぼう！</h1>
        <div class="status" id="status" role="status">ドリルを よみこんでいます...</div>
        <section class="list" id="drill-list" aria-label="ドリル一覧" hidden></section>
    </main>

    <template id="drill-template">
        <button class="start-button" type="button"></button>
    </template>

    <script>
        (() => {
            'use strict';

            const status = document.getElementById('status');
            const list = document.getElementById('drill-list');
            const template = document.getElementById('drill-template');

            const setError = (message) => {
                status.textContent = message;
                status.classList.add('error');
                status.hidden = false;
                document.querySelectorAll('.start-button').forEach(button => {
                    button.disabled = false;
                    button.removeAttribute('aria-busy');
                    button.textContent = button.dataset.title;
                });
            };

            const renderMenu = (payload) => {
                const drillSets = Array.isArray(payload?.drill_sets) ? payload.drill_sets : [];
                list.replaceChildren();
                const categoryGroups = new Map();

                drillSets.forEach(drillSet => {
                    const categoryId = String(drillSet.category_id ?? '');
                    let categoryGroup = categoryGroups.get(categoryId);
                    if (!categoryGroup) {
                        categoryGroup = document.createElement('div');
                        categoryGroup.className = 'category-group';
                        categoryGroups.set(categoryId, categoryGroup);
                        list.appendChild(categoryGroup);
                    }

                    const fragment = template.content.cloneNode(true);
                    const button = fragment.querySelector('.start-button');
                    const title = drillSet.title || 'タイトルなし';
                    button.textContent = title;
                    button.dataset.title = title;
                    button.setAttribute('aria-label', `${title}をはじめる`);
                    button.addEventListener('click', () => {
                        document.querySelectorAll('.start-button').forEach(item => {
                            item.disabled = true;
                        });
                        button.setAttribute('aria-busy', 'true');
                        button.textContent = 'よみこみちゅう...';
                        window.parent.postMessage({
                            type: 'scratch3-drill-select',
                            drill_set_code: drillSet.code
                        }, '*');
                    });
                    categoryGroup.appendChild(fragment);
                });

                if (drillSets.length === 0) {
                    status.textContent = 'いま えらべる ドリルは ありません。';
                    status.classList.remove('error');
                    status.hidden = false;
                    list.hidden = true;
                    return;
                }

                status.hidden = true;
                list.hidden = false;
            };

            window.addEventListener('message', (event) => {
                if (event.source !== window.parent) return;

                if (event.data?.type === 'scratch3-drill-menu') {
                    renderMenu(event.data.payload);
                } else if (event.data?.type === 'scratch3-drill-menu-error') {
                    setError(event.data.message || 'ドリルの一覧を読み込めませんでした。');
                } else if (event.data?.type === 'scratch3-drill-start-error') {
                    setError(event.data.message || 'ドリルを始められませんでした。');
                }
            });
        })();
    </script>
</body>
</html>
