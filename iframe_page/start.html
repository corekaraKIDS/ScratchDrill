<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ドリルをえらぼう</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
            color: #31495a;
            background: #eef9ff;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at 10% 8%, rgba(255, 255, 255, .9) 0 55px, transparent 56px),
                radial-gradient(circle at 92% 20%, rgba(255, 255, 255, .8) 0 80px, transparent 81px),
                linear-gradient(150deg, #88ddff 0%, #ddf6ff 48%, #fff4cf 100%);
        }

        .screen {
            width: min(980px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(24px, 5vw, 56px) clamp(16px, 4vw, 36px);
        }

        .header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
        }

        .eyebrow {
            margin: 0 0 6px;
            color: #24799b;
            font-size: clamp(15px, 2.5vw, 19px);
            font-weight: 800;
        }

        h1 {
            margin: 0;
            color: #ff704e;
            font-size: clamp(34px, 7vw, 58px);
            line-height: 1.15;
            letter-spacing: .04em;
            text-shadow: 0 4px 0 #ffe2a2;
        }

        .student {
            flex: 0 0 auto;
            padding: 10px 18px;
            color: #5c6f78;
            font-size: 15px;
            font-weight: 800;
            background: rgba(255, 255, 255, .85);
            border: 2px solid #fff;
            border-radius: 999px;
            box-shadow: 0 5px 14px rgba(66, 128, 153, .12);
        }

        .status {
            padding: 34px 24px;
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            background: rgba(255, 255, 255, .88);
            border: 4px solid #fff;
            border-radius: 26px;
            box-shadow: 0 12px 32px rgba(55, 126, 155, .16);
        }

        .status.error { color: #b84738; }

        .list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .drill {
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 22px;
            background: rgba(255, 255, 255, .96);
            border: 4px solid #fff;
            border-radius: 26px;
            box-shadow: 0 10px 0 rgba(60, 132, 162, .12), 0 18px 38px rgba(60, 132, 162, .15);
        }

        .drill-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .category {
            display: inline-block;
            padding: 5px 11px;
            color: #3b8099;
            font-size: 12px;
            font-weight: 900;
            background: #e3f7ff;
            border-radius: 999px;
        }

        .history-label {
            color: #7b8990;
            font-size: 12px;
            font-weight: 800;
        }

        .drill h2 {
            margin: 14px 0 6px;
            color: #3d5968;
            font-size: clamp(22px, 4vw, 29px);
            line-height: 1.25;
        }

        .description {
            min-height: 3em;
            margin: 0 0 18px;
            color: #687b85;
            line-height: 1.5;
        }

        .progress {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: auto;
            padding: 13px 15px;
            background: #fff8e7;
            border-radius: 16px;
        }

        .stars {
            display: flex;
            gap: 3px;
            color: #d5d9dc;
            font-size: 25px;
            line-height: 1;
        }

        .star.correct { color: #ffc928; text-shadow: 0 2px 0 #e9a711; }

        .score {
            color: #966b28;
            font-size: 14px;
            font-weight: 900;
            white-space: nowrap;
        }

        .start-button {
            width: 100%;
            margin-top: 16px;
            padding: 13px 18px;
            color: #fff;
            font: inherit;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            background: #ff7956;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 6px 0 #dc5337;
            transition: transform .12s ease, box-shadow .12s ease;
        }

        .start-button:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #dc5337; }
        .start-button:active { transform: translateY(4px); box-shadow: 0 2px 0 #dc5337; }
        .start-button:focus-visible { outline: 4px solid #5abce5; outline-offset: 3px; }
        .start-button:disabled { cursor: wait; opacity: .65; transform: none; box-shadow: 0 3px 0 #dc5337; }

        @media (max-width: 650px) {
            .header { align-items: start; flex-direction: column; gap: 14px; }
            .list { grid-template-columns: 1fr; }
            .description { min-height: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .start-button { transition: none; }
        }
    </style>
</head>
<body>
    <main class="screen">
        <header class="header">
            <div>
                <p class="eyebrow">きょうは なにに ちょうせんする？</p>
                <h1>ドリルを えらぼう！</h1>
            </div>
            <div class="student" id="student">せいと: ―</div>
        </header>

        <div class="status" id="status" role="status">ドリルを よみこんでいます...</div>
        <section class="list" id="drill-list" aria-label="ドリル一覧" hidden></section>
    </main>

    <template id="drill-template">
        <article class="drill">
            <div class="drill-top">
                <span class="category"></span>
                <span class="history-label"></span>
            </div>
            <h2></h2>
            <p class="description"></p>
            <div class="progress">
                <div class="stars" aria-hidden="true"></div>
                <span class="score"></span>
            </div>
            <button class="start-button" type="button">このドリルを はじめる</button>
        </article>
    </template>

    <script>
        (() => {
            'use strict';

            const STAR_COUNT = 3;
            const status = document.getElementById('status');
            const list = document.getElementById('drill-list');
            const template = document.getElementById('drill-template');

            const setError = (message) => {
                status.textContent = message;
                status.classList.add('error');
                status.hidden = false;
                document.querySelectorAll('.start-button').forEach(button => {
                    button.disabled = false;
                    button.textContent = 'もういちど はじめる';
                });
            };

            const makeStars = (results) => {
                const resultList = Array.isArray(results) ? results.slice(0, STAR_COUNT) : [];
                return Array.from({ length: STAR_COUNT }, (_, index) => {
                    const star = document.createElement('span');
                    star.className = resultList[index]?.is_correct === true ? 'star correct' : 'star';
                    star.textContent = '★';
                    return star;
                });
            };

            const renderMenu = (payload) => {
                const drillSets = Array.isArray(payload?.drill_sets) ? payload.drill_sets : [];
                const attempts = Array.isArray(payload?.attempts) ? payload.attempts : [];
                const attemptByDrillSetId = new Map(
                    attempts.map(attempt => [Number(attempt.drill_set_id), attempt])
                );

                const studentName = payload?.student_name || 'なまえなし';
                const studentId = payload?.student_id ?? '―';
                document.getElementById('student').textContent = `${studentName}（ID: ${studentId}）`;
                list.replaceChildren();

                drillSets.forEach(drillSet => {
                    const fragment = template.content.cloneNode(true);
                    const article = fragment.querySelector('.drill');
                    const attempt = attemptByDrillSetId.get(Number(drillSet.id));
                    const results = Array.isArray(attempt?.results) ? attempt.results : [];
                    const correctCount = results.filter(result => result.is_correct === true).length;
                    const total = results.length;

                    fragment.querySelector('.category').textContent = `カテゴリー ${drillSet.category_id}`;
                    fragment.querySelector('.history-label').textContent = attempt ? 'まえの けっか' : 'はじめて';
                    fragment.querySelector('h2').textContent = drillSet.title || 'タイトルなし';
                    fragment.querySelector('.description').textContent = drillSet.description || 'せつめいは ありません';

                    const stars = fragment.querySelector('.stars');
                    makeStars(results).forEach(star => stars.appendChild(star));
                    fragment.querySelector('.score').textContent = attempt
                        ? `${correctCount} / ${total} せいかい`
                        : 'まだ やっていないよ';

                    const button = fragment.querySelector('.start-button');
                    button.setAttribute('aria-label', `${drillSet.title || 'ドリル'}をはじめる`);
                    button.addEventListener('click', () => {
                        document.querySelectorAll('.start-button').forEach(item => {
                            item.disabled = true;
                        });
                        button.textContent = 'よみこみちゅう...';
                        window.parent.postMessage({
                            type: 'scratch3-drill-select',
                            drill_set_code: drillSet.code
                        }, '*');
                    });

                    article.dataset.drillSetId = String(drillSet.id);
                    list.appendChild(fragment);
                });

                if (drillSets.length === 0) {
                    status.textContent = 'いま えらべる ドリルは ありません。';
                    status.classList.remove('error');
                    status.hidden = false;
                    list.hidden = true;
                    return;
                }

                status.hidden = true;
                list.hidden = false;
            };

            window.addEventListener('message', (event) => {
                if (event.source !== window.parent) return;

                if (event.data?.type === 'scratch3-drill-menu') {
                    renderMenu(event.data.payload);
                } else if (event.data?.type === 'scratch3-drill-menu-error') {
                    setError(event.data.message || 'ドリルの一覧を読み込めませんでした。');
                } else if (event.data?.type === 'scratch3-drill-start-error') {
                    setError(event.data.message || 'ドリルを始められませんでした。');
                }
            });
        })();
    </script>
</body>
</html>
