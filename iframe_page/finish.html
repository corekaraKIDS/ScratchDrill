<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>けっか</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
            color: #533e2d;
            background: #fff8e8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 12% 18%, #fff 0 8px, transparent 9px),
                radial-gradient(circle at 88% 25%, #fff 0 6px, transparent 7px),
                linear-gradient(145deg, #8de2ff 0%, #d7f4ff 45%, #fff3c8 100%);
        }

        .screen {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 24px;
            isolation: isolate;
        }

        .decoration {
            position: absolute;
            z-index: -1;
            width: 18px;
            height: 18px;
            border-radius: 5px;
            opacity: .8;
            transform: rotate(24deg);
        }

        .decoration:nth-of-type(1) { top: 10%; left: 9%; background: #ff6f91; }
        .decoration:nth-of-type(2) { top: 16%; right: 11%; background: #ffd84d; transform: rotate(48deg); }
        .decoration:nth-of-type(3) { bottom: 13%; left: 13%; background: #69d39c; transform: rotate(67deg); }
        .decoration:nth-of-type(4) { right: 8%; bottom: 10%; background: #9b87f5; transform: rotate(12deg); }

        .card {
            width: min(680px, 100%);
            padding: clamp(28px, 6vw, 54px);
            text-align: center;
            background: rgba(255, 255, 255, .96);
            border: 6px solid #fff;
            border-radius: 36px;
            box-shadow: 0 18px 0 rgba(74, 146, 177, .16), 0 26px 60px rgba(49, 110, 138, .22);
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 12px;
            padding: 8px 22px;
            color: #fff;
            font-size: clamp(17px, 3vw, 23px);
            font-weight: 800;
            letter-spacing: .12em;
            background: #ff7b54;
            border-radius: 999px;
        }

        h1 {
            margin: 0;
            color: #ff6b4a;
            font-size: clamp(40px, 9vw, 74px);
            line-height: 1.1;
            letter-spacing: .05em;
            text-shadow: 0 4px 0 #ffe4a8;
        }

        .message {
            margin: 12px 0 24px;
            font-size: clamp(18px, 3.6vw, 26px);
            font-weight: 700;
            color: #666666;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 0 auto 24px;
        }

        .detail {
            min-width: 0;
            padding: 13px 16px;
            background: #fff8e8;
            border: 2px solid #ffe0a1;
            border-radius: 18px;
        }

        .detail-label {
            display: block;
            margin-bottom: 5px;
            color: #a87538;
            font-size: 13px;
            font-weight: 800;
        }

        .detail-value {
            display: block;
            overflow: hidden;
            font-size: clamp(17px, 3vw, 22px);
            font-weight: 800;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 3vw, 22px);
            margin: 4px 0 14px;
        }

        .star {
            color: #d8d8d8;
            font-size: clamp(58px, 13vw, 96px);
            line-height: 1;
            -webkit-text-stroke: 3px #b9b9b9;
            filter: drop-shadow(0 5px 0 rgba(0, 0, 0, .08));
        }

        .star.correct {
            color: #ffd83d;
            -webkit-text-stroke-color: #eea915;
            animation: pop .5s cubic-bezier(.2, 1.6, .5, 1) both;
        }

        .star:nth-child(2) { animation-delay: .12s; }
        .star:nth-child(3) { animation-delay: .24s; }

        .score {
            margin: 0;
            color: #5b91a7;
            font-size: clamp(19px, 3.8vw, 30px);
            font-weight: 900;
        }

        @keyframes pop {
            0% { opacity: 0; transform: scale(.2) rotate(-20deg); }
            100% { opacity: 1; transform: scale(1) rotate(0); }
        }

        @media (max-width: 520px) {
            .screen { padding: 14px; }
            .card { padding: 28px 18px; border-radius: 26px; }
            .details { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            .star.correct { animation: none; }
        }
    </style>
</head>
<body>
    <main class="screen">
        <span class="decoration" aria-hidden="true"></span>
        <span class="decoration" aria-hidden="true"></span>
        <span class="decoration" aria-hidden="true"></span>
        <span class="decoration" aria-hidden="true"></span>

        <section class="card" aria-labelledby="finish-title">
            <p class="eyebrow">おつかれさま！</p>
            <h1 id="finish-title">けっか</h1>

            <div class="details">
                <div class="detail">
                    <span class="detail-label">せいと</span>
                    <span class="detail-value" id="student-name">〇〇 〇〇</span>
                </div>
                <div class="detail">
                    <span class="detail-label">タイトル</span>
                    <span class="detail-value" id="drill-title">ドリルの タイトル</span>
                </div>
            </div>

            <div class="stars" id="stars" aria-label="3もんちゅう 0もん せいかい">
                <span class="star" aria-hidden="true">★</span>
                <span class="star" aria-hidden="true">★</span>
                <span class="star" aria-hidden="true">★</span>
            </div>
            <p class="score" id="score">3もんちゅう 0もん せいかい！</p>
            <p class="message">さいごまで よく がんばりました！</p>
        </section>
    </main>

    <script>
        (() => {
            'use strict';

            const QUESTION_COUNT = 3;

            const renderResults = (payload) => {
                const results = Array.isArray(payload?.results)
                    ? payload.results.slice(0, QUESTION_COUNT)
                    : [];
                const normalizedResults = Array.from(
                    { length: QUESTION_COUNT },
                    (_, index) => results[index]?.is_correct === true
                );
                const correctCount = normalizedResults.filter(Boolean).length;
                const stars = document.querySelectorAll('.star');

                stars.forEach((star, index) => {
                    star.classList.toggle('correct', normalizedResults[index]);
                });

                const scoreText = `${QUESTION_COUNT}もんちゅう ${correctCount}もん せいかい！`;
                document.getElementById('stars').setAttribute('aria-label', scoreText);
                document.getElementById('score').textContent = scoreText;

                if (payload?.student_name) {
                    document.getElementById('student-name').textContent = payload.student_name;
                }
                if (payload?.drill_set_title) {
                    document.getElementById('drill-title').textContent = payload.drill_set_title;
                }
            };

            window.addEventListener('message', (event) => {
                if (event.source !== window.parent) return;
                if (event.data?.type !== 'scratch3-drill-results') return;
                renderResults(event.data.payload);
            });
        })();
    </script>
</body>
</html>
